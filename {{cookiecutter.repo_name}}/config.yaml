# Absolute project root. `make` exports PROJECT_ROOT; without it, paths are
# resolved from the directory you launch from.
root: ${oc.env:PROJECT_ROOT,.}

main:
    project_name: {{cookiecutter.repo_name}}
    experiment_name: {{cookiecutter.experiment_name}}
    # Comma-separated list of steps from main.py's _steps, or "all"
    steps: all

launcher:
    # true: track to a local sqlite db (mlflow.db) and run steps in the current env
    local: false
    # Env manager for the steps when local is false: local (this .venv), uv (an
    # environment per step, created with uv) or virtualenv (same, needs pyenv)
    env_manager: local
    run_name: null

store:
    # Base folder for relative location paths
    local_root: ${root}/data
    # Download missing files on load and upload after save (see README > Store)
    sync_s3: false
    # Default bucket/prefix. A location uploads to <bucket>/<prefix>/<location name>
    # unless it sets its own bucket or prefix.
    bucket: ${oc.env:AWS_BUCKET,null}
    prefix: ml/{{cookiecutter.repo_name}}
    aws_profile: ${oc.env:AWS_PROFILE,null}
    region: ${oc.env:AWS_REGION,null}
    # S3-compatible endpoint, e.g. the local one from `docker compose --profile s3-local`
    endpoint_url: ${oc.env:AWS_ENDPOINT_URL,null}
    locations:
        raw:
            path: raw
        processed:
            path: processed
        models:
            path: ${root}/models
        # Example of a location with its own bucket and prefix:
        # analytics:
        #     path: analytics
        #     bucket: analytics-bucket
        #     prefix: team-x/{{cookiecutter.repo_name}}

# Step parameters: one section per step in main.py's _steps. Every key is passed
# to the step's MLproject as a parameter, e.g.:
#
# basic_cleaning:
#     input_artifact: listings.csv
#     output_artifact: clean.parquet
#
# data_check:
#     input_artifact: ${basic_cleaning.output_artifact}
#     output_artifact: data_check.html
