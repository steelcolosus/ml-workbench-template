services:
  ml-postgres:
    container_name: ml-postgres
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - ${POSTGRES_VOLUME}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # In-memory S3 for trying store.sync_s3 without AWS (data is lost on restart):
  #   docker compose --profile s3-local up -d
  # and set AWS_ENDPOINT_URL in .env (see example.env).
  s3-local:
    container_name: ml-s3-local
    image: motoserver/moto:5.2.4
    profiles: ["s3-local"]
    ports:
      - ${S3_LOCAL_PORT:-9000}:5000

  # The project's images, built with bake (docker/docker-bake.hcl). They aren't
  # started by `make` / `docker compose up`: `make docker-pipeline` and
  # `make docker-serve` build them and run them here.
  pipeline:
    profiles: ["pipeline"]
    image: {{cookiecutter.repo_name}}:pipeline
    pull_policy: never
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    environment:
      # Inside a container localhost is the container: reach the MLflow server
      # running on your machine (`make run`)
      MLFLOW_TRACKING_URI: ${DOCKER_MLFLOW_TRACKING_URI:-http://host.docker.internal:5000}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      # AWS profiles and SSO logins (`make login`) for store.sync_s3
      - ${HOME}/.aws:/root/.aws:ro

  serving:
    profiles: ["serving"]
    image: {{cookiecutter.repo_name}}:serving
    pull_policy: never
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    environment:
      SERVING_MODEL_NAME: ${SERVING_MODEL_NAME:-}
    ports:
      - ${SERVING_PORT:-8000}:8000
    volumes:
      - ./models:/app/models
      - ${HOME}/.aws:/home/app/.aws:ro
