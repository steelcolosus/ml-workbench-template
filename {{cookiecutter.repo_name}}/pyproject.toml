[project]
name = "{{cookiecutter.repo_name}}"
version = "0.1.0"
description = "{{cookiecutter.description}}"
readme = "README.md"
authors = [{ name = "{{cookiecutter.author_name}}" }]
requires-python = ">={{cookiecutter.python_version}}"
# Runtime dependencies: everything the pipeline and the steps import. Steps that
# MLflow runs in their own virtualenv install the project, so they get these too.
dependencies = [
    "boto3",
    "dask[dataframe]",
    "hydra-core",
    "hydra-joblib-launcher",
    "mlflow>=3",
    "omegaconf",
    "pandas",
    "psycopg2-binary",
    "pyarrow",
    "python-dotenv",
    "pyyaml",
    "scikit-learn",
    "statsmodels",
]

[dependency-groups]
dev = [
    "cookiecutter",
    "import-linter",
    "moto[s3]",
    "pre-commit",
    "pytest",
    "ruff",
]
notebook = [
    "ipywidgets",
    "jupyterlab",
    "jupyterlab-git",
]
eda = [
    "matplotlib",
    "seaborn",
    "ydata-profiling",
]

[tool.uv]
# `uv sync` and `uv run` install every group; `uv sync --no-group eda` skips one
default-groups = ["dev", "notebook", "eda"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ship the shared packages in src/ so they can be imported from anywhere (main.py,
# notebooks, tests, the MLflow steps and serving). src/steps/ holds the steps,
# which MLflow runs as scripts, so it is not a package.
[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/libs", "src/utils", "src/serving"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Dependency rules between the packages in src/ (checked by `make lint`):
# each layer may import the layers below it, never the ones above.
[tool.importlinter]
root_packages = ["serving", "libs", "core", "utils"]

[[tool.importlinter.contracts]]
name = "serving -> libs -> core -> utils"
type = "layers"
layers = ["serving", "libs", "core", "utils"]

[tool.ruff]
line-length = 88
src = ["src", "."]
extend-exclude = [".mlflow-envs", "templates", "notebooks", "*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["core", "libs", "utils", "serving"]
